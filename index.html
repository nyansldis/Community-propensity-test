<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>커뮤러 성향 테스트</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f2ee;color:#292522;font-family:Arial,"Noto Sans KR",sans-serif}
main{max-width:720px;margin:auto;min-height:100vh;padding:24px;display:flex;align-items:center}
.card{width:100%;background:#fffdfa;border:1px solid #e3ddd6;border-radius:26px;padding:38px;box-shadow:0 12px 40px rgba(50,40,30,.08)}
h1{font-size:48px;line-height:1.05;margin:12px 0 20px;letter-spacing:-3px}
h2{font-size:28px;line-height:1.5;margin:0 0 34px}
.kicker{font-size:12px;letter-spacing:3px;color:#8b8279;font-weight:bold}
.sub{color:#756e67;line-height:1.8}.result-note{font-size:11px;color:#aaa29b;margin:8px 0 22px}
.btn{border:0;border-radius:13px;padding:15px 22px;background:#292522;color:white;font-size:15px;font-weight:bold;cursor:pointer}
.progress{height:5px;background:#e8e1da;border-radius:9px;margin:15px 0 38px;overflow:hidden}
.bar{height:100%;width:0;background:#6f5b4e}
.qnum{font-size:12px;color:#8b8279}
.scale-labels{display:grid;grid-template-columns:1fr 1fr 1fr;color:#655e58;font-size:13px;font-weight:bold;text-align:center}.scale-labels span:first-child{text-align:left}.scale-labels span:last-child{text-align:right}
.scale{display:flex;align-items:center;justify-content:space-between;margin:25px auto 13px;max-width:560px}
.dot{border-radius:50%;background:#fffdfa;border:3px solid #a9998c;padding:0;cursor:pointer;display:block;flex:none}
.dot.one{width:48px;height:48px}.dot.two{width:39px;height:39px}.dot.three{width:31px;height:31px}
.dot:hover{transform:scale(1.1)}
.dot.selected{background:#6f5b4e;border-color:#6f5b4e;box-shadow:0 0 0 7px rgba(111,91,78,.13)}
.hint{display:flex;justify-content:space-between;color:#aaa29b;font-size:10px}
.back{margin-top:30px;background:#eee9e4;color:#514a44}
.result-code{font-size:72px;font-weight:900;letter-spacing:5px;margin:14px 0}
.result-name{font-size:24px;font-weight:bold;margin-top:10px}.result-wrap{max-width:560px;margin:auto;text-align:center}



@media(max-width:500px){.card{padding:25px 18px}h1{font-size:40px}.scale{gap:6px}.dot.one{width:42px;height:42px}.dot.two{width:34px;height:34px}.dot.three{width:27px;height:27px}}
</style>
</head>
<body>
<main>
<section class="card" id="intro">
<div class="kicker">COMMUNITY USER TYPE TEST</div>
<h1>커뮤러<br>성향 테스트</h1>
<p class="sub">자캐를 얼마나 불태우고, 관계를 어떻게 맺고,<br>어떤 창작을 좋아하는지 알아보세요.</p>
<button class="btn" id="start">테스트 시작</button>
</section>

<section class="card" id="quiz" style="display:none">
<div class="qnum" id="qnum"></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<h2 id="question"></h2>
<div id="choices"></div>
<button class="btn back" id="back">이전</button>
</section>

<section class="card" id="result" style="display:none">
<div class="result-wrap">
<div class="kicker">YOUR COMMUNITY TYPE</div>
<div class="result-code" id="code"></div>
<div class="result-name" id="resultName"></div>
<p class="sub" id="desc"></p>
<button class="btn" id="again">다시 하기</button>
</div>
</section>
</main>

<script>
const Q=[
["자캐의 설정을 세세한 부분까지 직접 정하고 싶다.","B","S"],
["커뮤가 끝난 뒤에도 자캐의 이야기를 계속 상상한다.","B","S"],
["자캐에게 새로운 설정을 추가하는 일이 즐겁다.","B","S"],
["자캐의 말투와 사소한 습관까지 정해두는 편이다.","B","S"],
["자캐의 해석이 내 생각과 다르면 신경 쓰인다.","B","S"],
["커뮤를 하지 않을 때도 자캐를 자주 생각한다.","B","S"],
["자캐에게 사건이나 서사를 만들어주는 것을 좋아한다.","B","S"],
["내 자캐는 하나의 창작물에 가깝다고 느낀다.","B","S"],
["상대가 며칠 동안 답하지 않아도 크게 신경 쓰지 않는다.","C","U"],
["관계가 예상대로 진행되지 않아도 유연하게 받아들인다.","C","U"],
["갈등이 생기면 감정과 상황을 나누어 생각하려 한다.","C","U"],
["상대의 반응이 평소와 달라도 바로 부정적으로 해석하지 않는다.","C","U"],
["관계가 끝났을 때 비교적 빠르게 마음을 정리한다.","C","U"],
["먼저 관계를 제안하는 것이 크게 부담스럽지 않다.","C","U"],
["커뮤에서 있었던 일이 끝난 뒤에도 오래 마음에 남지 않는다.","C","U"],
["답텀 때문에 내 행동을 지나치게 되짚어보지는 않는다.","C","U"],
["새 캐릭터를 만들 때 완전히 새로운 세계를 만드는 것이 좋다.","O","G"],
["오리지널 캐릭터를 만드는 것 자체가 재미있다.","O","G"],
["독자적인 세계관의 창작 커뮤에 더 끌린다.","O","G"],
["기존 작품과 관계없는 캐릭터도 오래 애정을 줄 수 있다.","O","G"],
["좋아하는 작품이 생기면 그 작품으로 캐릭터를 만들어보고 싶다.","G","O"],
["특정 작품의 세계관을 활용해 캐릭터를 만드는 것이 편하다.","G","O"],
["2차 창작 기반 커뮤니티를 찾아보는 것이 즐겁다.","G","O"],
["기존 작품의 설정이나 분위기가 창작의 출발점이 되는 경우가 많다.","G","O"],
["한 캐릭터에게 소수의 관계를 깊게 만드는 것을 선호한다.","F","D"],
["관계가 많아질수록 부담스럽다.","F","D"],
["특정 관계의 서사를 오래 이어가는 것이 가장 재미있다.","F","D"],
["새로운 관계보다 기존 관계를 깊게 발전시키는 편이다.","F","D"],
["여러 캐릭터와 다양한 관계를 맺는 것이 즐겁다.","D","F"],
["관계 제안이 많이 들어오면 오히려 신난다.","D","F"],
["한 캐릭터에게 다양한 관계성이 생기는 것을 좋아한다.","D","F"],
["여러 관계를 동시에 굴리며 서로 다른 서사를 만드는 것이 재미있다.","D","F"]
];
const WORD={B:"자덕",S:"방목",C:"안정형",U:"불안정형",O:"1차러",G:"2차러",F:"원앤온리",D:"다수자관"};
const NAMES={
BCOF:["불꽃의 세계관 장인","자캐와 관계를 깊게 파고들며 오리지널 창작을 불태우는 타입."],
BCOD:["서사의 수집가","자캐와 세계관을 적극적으로 확장하고 다양한 관계를 만들어가는 타입."],
BCGF:["관계 서사 작가","장르 기반 자캐에 깊게 몰입하며 특정 관계를 오래 이어가는 타입."],
BCGD:["장르의 연출가","장르 세계관 속에서 여러 캐릭터와 다양한 서사를 만들어가는 타입."],
BUOF:["고독한 창작가","오리지널 자캐에 깊게 몰입하면서 관계에는 신중한 타입."],
BUOD:["유랑하는 이야기꾼","자캐에 깊게 몰입하면서 여러 관계와 가능성을 탐색하는 타입."],
BUGF:["애정 깊은 해석가","장르 캐릭터와 특정 관계 하나하나에 강한 애정을 쏟는 타입."],
BUGD:["관계의 유희자","장르와 캐릭터를 자유롭게 넘나들며 다양한 관계를 즐기는 타입."],
SCOF:["느긋한 창작가","오리지널 자캐를 좋아하면서 부담 없이 천천히 관계를 쌓는 타입."],
SCOD:["느긋한 정원사","여러 자캐와 관계를 가볍고 편안하게 가꾸는 타입."],
SCGF:["편안한 장르러","좋아하는 장르 안에서 소수의 관계를 안정적으로 즐기는 타입."],
SCGD:["가벼운 유람객","장르와 관계를 폭넓게 즐기며 커뮤를 편하게 즐기는 타입."],
SUOF:["방랑하는 몽상가","오리지널 자캐를 자유롭게 두며 혼자서도 이야기를 즐기는 타입."],
SUOD:["자유로운 유목민","자캐와 관계에 얽매이지 않고 다양한 가능성을 찾아가는 타입."],
SUGF:["조용한 장르 애호가","장르 속 특정 관계를 편안하게 오래 즐기는 타입."],
SUGD:["커뮤 유목민","장르도 관계도 자유롭게 넘나들며 새로운 재미를 찾아가는 타입."]
};
let idx=0, ans=[];
function start(){idx=0;ans=[];show("quiz");render();}
function show(id){document.getElementById("intro").style.display=id==="intro"?"block":"none";document.getElementById("quiz").style.display=id==="quiz"?"block":"none";document.getElementById("result").style.display=id==="result"?"block":"none";}
function render(){
 const q=Q[idx];
 document.getElementById("qnum").textContent="QUESTION "+(idx+1)+" / "+Q.length;
 document.getElementById("bar").style.width=(idx/Q.length*100)+"%";
 document.getElementById("question").textContent=q[0];
 const c=document.getElementById("choices");
 c.innerHTML='<div class="scale-labels"><span>그렇지 않다</span><span>중립</span><span>그렇다</span></div>'+
 '<div class="scale">'+
 '<button type="button" class="dot one" data-v="-2"></button>'+
 '<button type="button" class="dot two" data-v="-1"></button>'+
 '<button type="button" class="dot three" data-v="0"></button>'+
 '<button type="button" class="dot two" data-v="1"></button>'+
 '<button type="button" class="dot one" data-v="2"></button></div>'+
 '';
 c.querySelectorAll(".dot").forEach(b=>{
   if(ans[idx]===Number(b.dataset.v)) b.classList.add("selected");
   b.addEventListener("click",()=>choose(Number(b.dataset.v)));
 });
 document.getElementById("back").disabled=idx===0;
}
function choose(v){ans[idx]=v;if(idx<Q.length-1){idx++;render();}else finish();}
function finish(){
  // One single source of truth: net score for each of the four axes.
  // Positive = the first letter in the question's Q[1], negative = Q[2].
  const net={B:0,C:0,O:0,F:0};

  ans.forEach((v,j)=>{
    const q=Q[j];
    const n=Number(v);
    const pair=q[1]+q[2];

    if(pair==="BS") net.B += n;
    else if(pair==="SB") net.B -= n;

    if(pair==="CU") net.C += n;
    else if(pair==="UC") net.C -= n;

    if(pair==="OG") net.O += n;
    else if(pair==="GO") net.O -= n;

    if(pair==="FD") net.F += n;
    else if(pair==="DF") net.F -= n;
  });

  const code=
    (net.B>=0?"B":"S")+
    (net.C>=0?"C":"U")+
    (net.O>=0?"O":"G")+
    (net.F>=0?"F":"D");

  const r=NAMES[code] || ["커뮤러 타입","당신만의 커뮤 성향을 가지고 있어요."];
  document.getElementById("code").textContent=code;
  document.getElementById("resultName").textContent=r[0];
  document.getElementById("desc").textContent=r[1];



  show("result");
}
document.getElementById("start").addEventListener("click",start);
document.getElementById("back").addEventListener("click",()=>{if(idx>0){idx--;render();}});
document.getElementById("again").addEventListener("click",()=>show("intro"));
</script>
</body>
</html>
